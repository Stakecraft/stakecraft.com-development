# ---------------------------------------------------------------------------
# nginx site config for backend.stakecraft.com
#
# Apply on the API host (currently 65.108.124.57):
#   sudo cp backend.stakecraft.com.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/backend.stakecraft.com.conf \
#               /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires the http-level settings in security-headers.conf (see README.md).
# ---------------------------------------------------------------------------

# Rate limiting zones. These are defence in depth: the application enforces its
# own limits, but doing it here means abusive traffic is dropped before it
# reaches Node and costs a database round trip.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name backend.stakecraft.com;

    # Everything except the ACME challenge goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name backend.stakecraft.com;

    ssl_certificate     /etc/letsencrypt/live/backend.stakecraft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend.stakecraft.com/privkey.pem;

    # TLS 1.2 and 1.3 only. Older versions have no modern client that needs them.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Do not report the nginx version in responses or error pages. The
    # assessment fingerprinted nginx/1.18.0 (Ubuntu) from these.
    server_tokens off;

    # Bound request size. The API accepts at most a 5MB image upload; anything
    # larger is either a mistake or an attempt to exhaust memory.
    client_max_body_size 6M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Cap concurrent connections from a single address.
    limit_conn api_conn 20;

    access_log /var/log/nginx/backend.stakecraft.com.access.log;
    error_log  /var/log/nginx/backend.stakecraft.com.error.log warn;

    # ---------------------------------------------------------------------
    # Credential endpoints get a much tighter limit than the rest of the API.
    # burst=5 nodelay allows a genuine user who mistypes a few times, while
    # still stopping sustained password guessing.
    # ---------------------------------------------------------------------
    location ~ ^/api/auth/(login|setup) {
        limit_req zone=api_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/snippets/stakecraft-proxy.conf;
        proxy_read_timeout 30s;
    }

    location / {
        limit_req zone=api_general burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/snippets/stakecraft-proxy.conf;
        proxy_read_timeout 60s;
    }

    # Security headers. The application sets these too (helmet); repeating them
    # here means they survive even if a request is served without reaching Node.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}
