# ---------------------------------------------------------------------------
# Shared proxy settings for the StakeCraft Node backends.
#
# Install as /etc/nginx/snippets/stakecraft-proxy.conf
#
# X-Forwarded-For is what the application's rate limiter uses to identify a
# client. The app sets `trust proxy` to exactly 1 hop, so nginx must be the
# only thing appending to this header - otherwise a client could send its own
# X-Forwarded-For and be counted as a different address on every request.
# ---------------------------------------------------------------------------

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# WebSocket/upgrade passthrough (harmless if unused).
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection "";

proxy_connect_timeout 10s;
proxy_send_timeout    60s;

# proxy_read_timeout is deliberately NOT set here. nginx rejects a duplicate
# directive in the same context, and the AI chat location needs a longer value
# than the rest of the API, so each location sets its own.

# Never let the upstream advertise its stack.
proxy_hide_header X-Powered-By;
proxy_hide_header Server;
